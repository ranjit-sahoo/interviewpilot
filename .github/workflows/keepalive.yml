name: keepalive
# Pings the free Render instance every 10 minutes so judges and users do not hit a cold start.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://mockrep.onrender.com/health
